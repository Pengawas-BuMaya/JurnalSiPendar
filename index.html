            const handleChange = (id, field, value) => {
                if (isReadOnly) return;
                const next = { ...data, [id]: { ...data[id], [field]: value } };
                if (id === 'h1' && field === 'timeValue') {
                    const [h, m] = value.split(':').map(Number);
                    next[id].status = (h + (m / 60)) >= 4 && (h + (m / 60)) <= 6;
                }
                if (id === 'h7' && field === 'timeValue') {
                    const [h, m] = value.split(':').map(Number);
                    next[id].status = (h + (m / 60)) >= 19 && (h + (m / 60)) <= 21.5;
                }
                setData(next);
            };

                <div className="space-y-4 relative z-10">

        function PrincipalDashboard({ user, notify }) {
            const [selectedMonth, setSelectedMonth] = React.useState(new Date().toISOString().substring(0, 7));
            const [classStats, setClassStats] = React.useState([]);
            const [habitStats, setHabitStats] = React.useState(null); 
            const [overallScore, setOverallScore] = React.useState(0);
            const [isScanning, setIsScanning] = React.useState(false);
            const [reportDoc, setReportDoc] = React.useState({ isSubmitted: false });
            
            // State for new Principal Note
            const [principalNote, setPrincipalNote] = React.useState('');
            
            const schoolStudents = React.useMemo(() => ALL_STUDENTS.filter(s => s.schoolId === user.schoolId), [user.schoolId]);
            const schoolClasses = React.useMemo(() => Array.from(new Set(schoolStudents.map(st => st.classId))).sort(), [schoolStudents]);

            React.useEffect(() => {
                if (!db) return;
                const unsub = db.collection('artifacts').doc(APP_ID).collection('public').doc('data').collection(`ks_reports_${user.schoolId}`).doc(selectedMonth).onSnapshot(doc => {
                    if (doc.exists) {
                        const data = doc.data();
                        setReportDoc(data);
                        if (data.habitStats) {
                            setHabitStats(data.habitStats);
                            setClassStats(data.classStats || []);
                            setOverallScore(data.overallScore || 0);
                            setPrincipalNote(data.principalNote || ''); // Load existing note
                        } else {
                            setHabitStats(null);
                            setPrincipalNote('');
                        }
                    } else {
                        setReportDoc({ isSubmitted: false });
                        setClassStats([]);
                        setHabitStats(null);
                        setPrincipalNote('');
                    }
                });
                return () => unsub();
            }, [selectedMonth, user.schoolId]);

            const handleFetchRekap = async () => {
                setIsScanning(true);
                const stats = {}; 
                let totalSchoolLogs = 0;
                const hCounts = { h1: 0, h2: 0, h3: 0, h4: 0, h5: 0, h6: 0, h7: 0 };
                
                schoolClasses.forEach(c => stats[c] = { classId: c, totalStudents: 0, totalLogs: 0, sumScore: 0 });

                for (const std of schoolStudents) {
                    if (stats[std.classId]) stats[std.classId].totalStudents++;
                    try {
                        const snap = await db.collection('artifacts').doc(APP_ID).collection('public').doc('data').collection(`logs_${user.schoolId}_${std.id}`).get();
                        snap.forEach(d => {
                            if (d.id.startsWith(selectedMonth)) {
                                const data = d.data();
                                stats[std.classId].totalLogs++;
                                stats[std.classId].sumScore += (data.completionPercentage || 0);
                                
                                totalSchoolLogs++;
                                HABITS.forEach(h => {
                                    if (data[h.id] && data[h.id].status === true) hCounts[h.id]++;
                                });
                            }
                        });
                    } catch (e) { }
                }

                setClassStats(Object.values(stats).map(c => ({ ...c, avgScore: c.totalLogs > 0 ? Math.round(c.sumScore / c.totalLogs) : 0 })));
                
                const newHabitStats = {};
                let sumPercentages = 0;
                HABITS.forEach(h => {
                    const pct = totalSchoolLogs > 0 ? Math.round((hCounts[h.id] / totalSchoolLogs) * 100) : 0;
                    newHabitStats[h.id] = pct;
                    sumPercentages += pct;
                });
                
                setHabitStats(newHabitStats);
                setOverallScore(totalSchoolLogs > 0 ? Math.round(sumPercentages / 7) : 0);
                setIsScanning(false);
            };

                if (!habitStats) return;
                try {
                    await db.collection('artifacts').doc(APP_ID).collection('public').doc('data').collection(`ks_reports_${user.schoolId}`).doc(selectedMonth).set({
                        isSubmitted: true,
                        submittedAt: new Date().toISOString(),
                        schoolName: user.schoolName,
                        overallScore,
                        classStats,
                        habitStats,
                        principalNote // Save note to database
                    }, { merge: true });

                } catch (e) {
                    notify({ type: 'error', title: 'Gagal', message: e.message });
                }
            };

                        <div className="absolute -right-4 -bottom-4 text-8xl opacity-20">🏫</div>
                        <div className="text-[11px] uppercase font-black tracking-widest text-amber-100">Kepala Sekolah</div>
                        <h2 className="text-2xl font-black mt-1 drop-shadow-md">{user.schoolName}</h2>
                        {reportDoc.isSubmitted && <div className="mt-3 inline-block bg-white text-amber-600 px-3 py-1 rounded-xl text-xs font-black shadow-sm">✅ Terkirim ke Dinas</div>}
                    </div>

                    <Card className="p-5">
                        <label className="block text-xs font-black text-slate-500 mb-2">Pilih Bulan Laporan</label>
                        <input type="month" value={selectedMonth} onChange={(e) => { setSelectedMonth(e.target.value); setClassStats([]); setHabitStats(null); }} className="w-full bg-slate-50 border-4 border-slate-100 rounded-2xl p-3 font-black text-slate-700 outline-none mb-4 focus:border-amber-200" />
                        {!reportDoc.isSubmitted && (
                            <button onClick={handleFetchRekap} disabled={isScanning} className="w-full bg-slate-800 hover:bg-slate-700 active:scale-95 text-white font-extrabold py-3.5 rounded-2xl shadow-[0_5px_0_0_#0f172a] hover:shadow-[0_3px_0_0_#0f172a] active:translate-y-[5px] active:shadow-none transition-all">
                                {isScanning ? 'Memproses Data ⏳' : 'Tarik Rekap Kelas & Kebiasaan 📊'}
                            </button>
                        )}
                    </Card>

                    {habitStats && (
                        <div className="animate-fade-in-up space-y-4">
                            <Card className="p-5">
                                <div className="text-center mb-5 pb-4 border-b-2 border-slate-100">
                                    <h3 className="font-black text-lg text-slate-800">Rekapitulasi 7 Kebiasaan</h3>
                                    <p className="text-xs font-bold text-slate-500 mt-1">Capaian seluruh siswa (Berdasarkan Laporan Valid)</p>
                                </div>
                                
                                <div>
                                    {HABITS.map(h => (
                                        <HabitStatRow key={h.id} habit={h} percentage={habitStats[h.id] || 0} />
                                    ))}
                                </div>

                                <div className="mt-4 p-4 rounded-[1.5rem] bg-slate-50 border-2 border-slate-100 flex justify-between items-center">
                                    <span className="font-extrabold text-sm text-slate-600">Rata-rata Keseluruhan:</span>
                                    <span className={`text-xl font-black px-3 py-1 rounded-xl text-white ${getProgressColorClass(overallScore)}`}>
                                        {overallScore}%
                                    </span>
                                </div>
                            </Card>

                            {classStats.length > 0 && (
                                <Card className="overflow-hidden">
                                    <div className="bg-slate-50 px-5 py-4 border-b-2 border-slate-100 font-black text-slate-700 text-sm">Validasi Per Kelas</div>
                                    <div className="divide-y-2 divide-slate-50 p-2 max-h-64 overflow-y-auto student-list">
                                        {classStats.map(stat => (
                                            <div key={stat.classId} className="p-3 bg-white rounded-xl mb-1 flex justify-between items-center">
                                                <div>
                                                    <span className="font-black text-sm text-slate-800">Kelas {stat.classId}</span>
                                                    <p className="text-xs font-bold text-slate-500">{stat.totalStudents} Siswa • Rata-rata Skor: <span className="text-amber-500 font-black">{stat.avgScore}%</span></p>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </Card>
                            )}
                            
                            {/* NEW: Display Supervisor Feedback if exists */}
                            {reportDoc.supervisorFeedback && (
                                <Card className="p-5 border-t-[6px] border-t-indigo-400 bg-indigo-50">
                                    <div className="flex items-center gap-2 mb-2">
                                        <span className="text-xl">👁️</span>
                                        <h4 className="font-black text-sm text-indigo-900">Feedback Pengawas</h4>
                                    </div>
                                    <div className="bg-white p-3.5 rounded-xl border-2 border-indigo-100">
                                        <p className="text-sm font-bold text-slate-700 whitespace-pre-wrap">{reportDoc.supervisorFeedback}</p>
                                    </div>
                                </Card>
                            )}

                            {/* NEW: Input for Principal Note */}
                            <Card className="p-5 border-2 border-amber-200">
                                <label className="block text-sm font-black text-slate-700 mb-2">Catatan Kepala Sekolah <span className="text-xs font-bold text-slate-400">(Opsional)</span></label>
                                <textarea 
                                    value={principalNote} 
                                    onChange={(e) => setPrincipalNote(e.target.value)} 
                                    disabled={reportDoc.isSubmitted}
                                    placeholder="Tuliskan catatan, kendala, atau pencapaian sekolah bulan ini untuk disampaikan ke Pengawas..."
                                    className="w-full bg-slate-50 border-2 border-slate-200 rounded-xl p-3 text-sm font-bold outline-none focus:border-amber-400 transition-colors resize-none h-24"
                                />
                                {reportDoc.isSubmitted && principalNote && (
                                    <p className="text-xs font-bold text-emerald-600 mt-2">✓ Catatan telah terkirim bersama laporan.</p>
                                )}
                            </Card>

                            {!reportDoc.isSubmitted && (
                                <button onClick={() => notify({ type: 'confirm', title: 'Kirim Laporan', message: 'Anda yakin data rekapitulasi dan catatan bulan ini sudah benar? Data akan dikirim ke Pengawas Sekolah.', confirmText: 'Kirim Sekarang', onConfirm: handleSubmitReport })} className="w-full bg-gradient-to-b from-blue-400 to-indigo-500 active:scale-95 text-white font-extrabold py-4 rounded-2xl shadow-[0_6px_0_0_#4338ca] hover:translate-y-[2px] active:translate-y-[6px] active:shadow-none transition-all border-2 border-blue-300">
                                    Kirim Laporan ke Pengawas 🚀
                                </button>
                            )}
                        </div>
                    )}
                </div>
            );
        }

        function SupervisorDashboard({ user, notify }) {
            const [selectedMonth, setSelectedMonth] = React.useState(new Date().toISOString().substring(0, 7));
            const [schoolsData, setSchoolsData] = React.useState([]);
            const [expandedSchoolId, setExpandedSchoolId] = React.useState(null);
            
            // State for Supervisor Feedback inputs
            const [feedbackInputs, setFeedbackInputs] = React.useState({});

            React.useEffect(() => {
                if (!db) return;
                const unsubscribes = SCHOOLS.map(school => 
                    db.collection('artifacts').doc(APP_ID).collection('public').doc('data').collection(`ks_reports_${school.id}`).doc(selectedMonth).onSnapshot(doc => {
                        setSchoolsData(prev => {
                            const newMap = new Map(prev.map(p => [p.school.id, p]));
                            newMap.set(school.id, { school, report: doc.exists ? doc.data() : null });
                            return SCHOOLS.map(s => newMap.get(s.id) || { school: s, report: null });
                        });
                    })
                );
                return () => unsubscribes.forEach(fn => fn());
            }, [selectedMonth]);

            const handleExpand = (schoolId, existingFeedback) => {
                if (expandedSchoolId === schoolId) {
                    setExpandedSchoolId(null);
                } else {
                    setExpandedSchoolId(schoolId);
                    // Initialize the input with existing feedback if it hasn't been modified yet
                    if (feedbackInputs[schoolId] === undefined) {
                        setFeedbackInputs(prev => ({...prev, [schoolId]: existingFeedback || ''}));
                    }
                }
            };

            const handleSubmitFeedback = async (schoolId) => {
                const feedback = feedbackInputs[schoolId];
                if (!feedback || feedback.trim() === '') {
                    notify({ type: 'error', title: 'Feedback Kosong', message: 'Silakan isi feedback terlebih dahulu.'});
                    return;
                }
                
                try {
                    await db.collection('artifacts').doc(APP_ID).collection('public').doc('data')
                        .collection(`ks_reports_${schoolId}`).doc(selectedMonth)
                        .set({
                            supervisorFeedback: feedback,
                            feedbackAt: new Date().toISOString()
                        }, { merge: true });
                        
                    notify({ type: 'info', title: 'Berhasil', message: 'Feedback berhasil dikirim ke Kepala Sekolah.', icon: '💬' });
                } catch (e) {
                    notify({ type: 'error', title: 'Gagal', message: e.message });
                }
            };

            return (
                <div className="space-y-4 relative z-10">
                    <div className="bg-gradient-to-br from-indigo-400 to-blue-600 rounded-[2rem] p-6 text-white shadow-lg border-4 border-indigo-200 relative overflow-hidden">
                        <div className="absolute -right-4 -bottom-4 text-8xl opacity-20">👁️</div>
                        <div className="text-[11px] uppercase font-black tracking-widest text-indigo-100">Pengawas</div>
                        <h2 className="text-2xl font-black mt-1 drop-shadow-md">Dashboard Dinas</h2>
                    </div>

                    <Card className="p-5">
                        <label className="block text-xs font-black text-indigo-300 uppercase tracking-wider mb-2 text-center">Bulan Pantauan</label>
                        <input type="month" value={selectedMonth} onChange={(e) => { setSelectedMonth(e.target.value); setExpandedSchoolId(null); }} className="w-full bg-indigo-50/50 border-4 border-indigo-100 rounded-2xl p-3 font-black text-indigo-900 outline-none focus:border-indigo-300 text-center" />
                    </Card>

                    <Card className="overflow-hidden">
                        <div className="bg-slate-50 px-5 py-4 border-b-2 border-slate-100 font-black text-slate-700 text-sm flex justify-between">
                            <span>Hasil Pelaporan Per Sekolah</span>
                        </div>
                        <div className="divide-y-[3px] divide-slate-100 p-3 max-h-[70vh] overflow-y-auto student-list bg-white">
                            {schoolsData.map(data => {
                                const isSubmitted = data.report?.isSubmitted;
                                const isExpanded = expandedSchoolId === data.school.id;
                                
                                return (
                                    <div key={data.school.id} className={`rounded-[1.25rem] mb-3 border-2 transition-all duration-300 ${isExpanded ? 'border-indigo-300 bg-indigo-50/30' : 'border-slate-100 bg-white hover:border-indigo-100'}`}>
                                        <div onClick={() => isSubmitted && handleExpand(data.school.id, data.report?.supervisorFeedback)} className={`p-4 flex justify-between items-center ${isSubmitted ? 'cursor-pointer' : 'opacity-70'}`}>
                                            <div>
                                                <p className="font-black text-[15px] text-slate-800">{data.school.name}</p>
                                                <div className="mt-1.5 flex items-center gap-2 flex-wrap">
                                                    {isSubmitted ? (
                                                        <>
                                                            <span className="text-[10px] font-black text-white bg-emerald-500 px-2 py-0.5 rounded-lg">✅ Tervalidasi KS</span>
                                                            <span className="text-[10px] font-bold text-slate-500">Skor: {data.report.overallScore || 0}%</span>
                                                            {data.report.principalNote && <span className="text-[10px] font-black text-amber-700 bg-amber-100 px-2 py-0.5 rounded-lg">📝 Ada Catatan</span>}
                                                            {data.report.supervisorFeedback && <span className="text-[10px] font-black text-indigo-700 bg-indigo-100 px-2 py-0.5 rounded-lg">💬 Direspon</span>}
                                                        </>
                                                    ) : (
                                                        <span className="text-[10px] font-black text-slate-500 bg-slate-200 px-2 py-0.5 rounded-lg">⏳ Menunggu KS</span>
                                                    )}
                                                </div>
                                            </div>
                                            {isSubmitted && (
                                                <div className="w-8 h-8 rounded-full bg-indigo-100 text-indigo-600 flex items-center justify-center font-black shrink-0">
                                                    {isExpanded ? '▲' : '▼'}
                                                </div>
                                            )}
                                        </div>

                                        {isExpanded && isSubmitted && data.report.habitStats && (
                                            <div className="p-4 border-t-2 border-indigo-100 bg-white rounded-b-[1rem] animate-fade-in">
                                                {/* NEW: Display Principal's Note */}
                                                {data.report.principalNote && (
                                                    <div className="mb-5 bg-amber-50 p-3.5 rounded-xl border border-amber-200">
                                                        <p className="text-[11px] font-black text-amber-800 uppercase tracking-wider mb-1 flex items-center gap-1"><span>📝</span> Catatan Kepala Sekolah</p>
                                                        <p className="text-sm font-bold text-slate-700 whitespace-pre-wrap">{data.report.principalNote}</p>
                                                    </div>
                                                )}

                                                <p className="text-[11px] font-black text-slate-500 mb-3 text-center uppercase tracking-wider">Capaian Tiap Kebiasaan</p>
                                                {HABITS.map(h => (
                                                    <HabitStatRow key={h.id} habit={h} percentage={data.report.habitStats[h.id] || 0} />
                                                ))}

                                                {/* NEW: Supervisor Feedback Section */}
                                                <div className="mt-5 pt-5 border-t-2 border-indigo-50">
                                                    <p className="text-[11px] font-black text-indigo-500 mb-2 uppercase tracking-wider">Berikan Feedback / Respon</p>
                                                    <div className="flex flex-col gap-3">
                                                        <textarea
                                                            value={feedbackInputs[data.school.id] || ''}
                                                            onChange={(e) => setFeedbackInputs(prev => ({...prev, [data.school.id]: e.target.value}))}
                                                            placeholder="Tuliskan respon, apresiasi, atau arahan untuk Kepala Sekolah..."
                                                            className="w-full bg-slate-50 border-2 border-slate-200 rounded-xl p-3 text-sm font-bold outline-none focus:border-indigo-400 transition-colors resize-none h-20"
                                                        />
                                                        <button
                                                            onClick={() => handleSubmitFeedback(data.school.id)}
                                                            className="w-full bg-indigo-500 text-white font-extrabold py-3 rounded-xl shadow-sm hover:bg-indigo-600 transition-colors border-2 border-indigo-400 flex justify-center items-center gap-2"
                                                        >
                                                            <span>Kirim Feedback</span> <span>📨</span>
                                                        </button>
                                                    </div>
                                                </div>

                                            </div>
                                        )}
                                    </div>
                                );
                            })}
                        </div>
                    </Card>
                </div>
            );
        }

        function App() {
            const [currentUser, setCurrentUser] = React.useState(null);
            const [authLoading, setAuthLoading] = React.useState(true);
            const [notificationConfig, setNotificationConfig] = React.useState(null);
            const [showWelcome, setShowWelcome] = React.useState(true); 

            React.useEffect(() => {
                const init = async () => {
                    try {
                        if (auth) {
                            if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) await auth.signInWithCustomToken(__initial_auth_token);
                            else await auth.signInAnonymously();
                        }
                    } catch (e) { console.warn(e); } finally { setAuthLoading(false); }
                };
                init();
            }, []);

            if (authLoading) return <div className="flex-1 flex items-center justify-center text-sm font-black text-sky-600 animate-pulse">Memuat Keajaiban SI-PENDAR ✨...</div>;

            return (
                <div className="flex-1 flex flex-col relative min-h-screen">
                    <header className="bg-white/90 backdrop-blur-md sticky top-0 z-40 px-5 h-16 flex items-center justify-between border-b-4 border-sky-100 shadow-sm rounded-b-3xl mx-2 mt-2">
                        <div className="flex items-center gap-3">
                            <img src="https://lh3.googleusercontent.com/d/1c6uHZ_Ua16c52Oz0X-4dCG-nkFNcSsI6" onError={(e) => { e.target.onerror = null; e.target.src = "https://drive.google.com/thumbnail?id=1c6uHZ_Ua16c52Oz0X-4dCG-nkFNcSsI6&sz=w200"; }} alt="Logo" className="w-10 h-10 object-contain drop-shadow-sm" />
                            <div>
                                <h1 className="font-black text-sm text-sky-700 leading-tight tracking-tight">SI-PENDAR</h1>
                                <p className="text-[10px] font-bold text-slate-500">{currentUser ? currentUser.schoolName : 'Anak Hebat'}</p>
                            </div>
                        </div>
                        {currentUser && (
                            <button onClick={() => setNotificationConfig({ type: 'confirm', title: 'Keluar Akun', message: 'Yakin ingin keluar?', confirmText: 'Keluar', onConfirm: () => setCurrentUser(null) })} className="px-3 py-1.5 rounded-[10px] text-xs font-black text-white bg-slate-300 hover:bg-slate-400 transition-colors shadow-sm">
                                Keluar
                            </button>
                        )}
                    </header>

                    <main className="flex-1 p-4 pb-12">
                        {!currentUser ? (
                            showWelcome ? <WelcomeScreen onStart={() => setShowWelcome(false)} /> : <LoginScreen onLogin={setCurrentUser} notify={setNotificationConfig} />
                        ) : (
                            <>
                                <BackgroundOrnaments />
                                {currentUser.role === 'student' && <StudentDashboard user={currentUser} notify={setNotificationConfig} />}
                                {currentUser.role === 'parent' && <ParentDashboard user={currentUser} notify={setNotificationConfig} />}
                                {currentUser.role === 'teacher' && <TeacherDashboard user={currentUser} notify={setNotificationConfig} />}
                                {currentUser.role === 'principal' && <PrincipalDashboard user={currentUser} notify={setNotificationConfig} />}
                                {currentUser.role === 'supervisor' && <SupervisorDashboard user={currentUser} notify={setNotificationConfig} />}
                            </>
                        )}
                    </main>

                    <NotificationModal config={notificationConfig} onClose={() => setNotificationConfig(null)} />
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
