                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        const TimePicker24H = ({ value, onChange, disabled }) => {
            const [hours, minutes] = (value && value.includes(':')) ? value.split(":") : ["05", "00"];

            const handleHour = (e) => {
                onChange(`${e.target.value.padStart(2, '0')}:${minutes}`);
            };

            const handleMin = (e) => {
                onChange(`${hours}:${e.target.value.padStart(2, '0')}`);
            };

            const hourOptions = Array.from({ length: 24 }, (_, i) => i.toString().padStart(2, '0'));
            const minOptions = Array.from({ length: 60 }, (_, i) => i.toString().padStart(2, '0'));

            return (
                <div className="flex items-center gap-1 bg-white border border-blue-200 rounded-xl px-2 py-1 shadow-xs">
                    <select 
                        value={hours} 
                        onChange={handleHour}
                        disabled={disabled}
                        className="bg-transparent text-xs font-bold text-blue-700 outline-none p-1 cursor-pointer"
                    >
                        {hourOptions.map(h => <option key={h} value={h}>{h}</option>)}
                    </select>
                    <span className="text-blue-400 font-bold text-xs">:</span>
                    <select 
                        value={minutes} 
                        onChange={handleMin}
                        disabled={disabled}
                        className="bg-transparent text-xs font-bold text-blue-700 outline-none p-1 cursor-pointer"
                    >
                        {minOptions.map(m => <option key={m} value={m}>{m}</option>)}
                    </select>
                </div>
            );
        };

        function HabitList({ initialData, onSave, isReadOnly, notify }) {
            const [data, setData] = React.useState({});
            const [expanded, setExpanded] = React.useState(null);

            React.useEffect(() => {
                const defaults = {};
                HABITS.forEach(h => {
                    defaults[h.id] = initialData[h.id] || { 
                        status: false, 
                        timeValue: h.id === 'h1' ? '05:00' : h.id === 'h7' ? '20:30' : '' 
                    };
                });
                setData(defaults);
            }, [initialData]);

            const handleChange = (id, field, value) => {
                if (isReadOnly) return;
                const next = { ...data, [id]: { ...data[id], [field]: value } };

                if (id === 'h1' && field === 'timeValue') {
                    const [h, m] = value.split(':').map(Number);
                    const dec = h + (m / 60);
                    next[id].status = dec >= 4 && dec <= 6;
                }
                if (id === 'h7' && field === 'timeValue') {
                    const [h, m] = value.split(':').map(Number);
                    const dec = h + (m / 60);
                    // Tidur sebelum 21.30
                    next[id].status = (dec >= 19 && dec <= 21.5);
                }

                setData(next);
            };

            const handleTriggerSave = () => {
                notify({
                    type: 'confirm',
                    title: 'Simpan Jurnal Harian',
                    message: 'Jurnal harian hanya dapat diisi 1 kali per hari. Pastikan seluruh isian sudah jujur dan lengkap.',
                    confirmText: 'Ya, Simpan',
                    cancelText: 'Periksa Lagi',
                    onConfirm: () => onSave(data)
                });
            };

                <div className="space-y-3">
                    {HABITS.map((habit, idx) => {
                        const cur = data[habit.id] || { status: false, timeValue: '' };

                                        #{idx + 1}
                                    </div>
                                    <div 
                                        className="flex-1 cursor-pointer select-none"
                                        onClick={() => setExpanded(isExp ? null : habit.id)}

        function StudentDashboard({ user, notify }) {
            const [date, setDate] = React.useState(new Date().toISOString().split('T')[0]);
            const [logs, setLogs] = React.useState({});
            const [isSaving, setIsSaving] = React.useState(false);
            const [isMonthLocked, setIsMonthLocked] = React.useState(false);

            const docPath = `logs_${user.schoolId}_${user.id}`;

            React.useEffect(() => {
                if (!db) return;
                const unsub = db.collection('artifacts').doc(APP_ID)
                    .collection('public').doc('data')
                    .collection(docPath).onSnapshot(snap => {
                        const all = {};
                        snap.forEach(d => all[d.id] = d.data());
                        setLogs(all);
                    }, err => console.error("Firestore listener error:", err));

                const currentMonth = date.substring(0, 7);
                const unsubLock = db.collection('artifacts').doc(APP_ID)
                    .collection('public').doc('data')
                    .collection(`ks_reports_${user.schoolId}`).doc(currentMonth)
                    .onSnapshot(doc => {
                        if (doc.exists && doc.data().isSubmitted) setIsMonthLocked(true);
                        else setIsMonthLocked(false);
                    }, err => console.error("Lock listener error:", err));

                return () => {
                    unsub && unsub();
                    unsubLock && unsubLock();
                };
            }, [user.schoolId, user.id, date]);

            const todayLog = logs[date] || null;
            const isFilled = Boolean(todayLog);

            const handleSave = async (habitData) => {
                setIsSaving(true);
                let count = 0;
                Object.keys(habitData).forEach(k => {
                    if (habitData[k]?.status) count++;
                });
                const percentage = Math.round((count / 7) * 100);

                const payload = {
                    role: 'student',
                    ...habitData,
                    date,
                    studentId: user.id,
                    studentName: user.name,
                    schoolId: user.schoolId,
                    schoolName: user.schoolName,
                    classId: user.classId,
                    completionPercentage: percentage,
                    updatedAt: new Date().toISOString()
                };

                try {
                    if (db) {
                        await db.collection('artifacts').doc(APP_ID)
                            .collection('public').doc('data')
                            .collection(docPath).doc(date)
                            .set(payload, { merge: true });
                    }

                    if (GOOGLE_SHEET_SCRIPT_URL) {
                        fetch(GOOGLE_SHEET_SCRIPT_URL, {
                            method: 'POST',
                            mode: 'no-cors',
                            headers: { 'Content-Type': 'text/plain' },
                            body: JSON.stringify(payload)
                        }).catch(e => console.warn("Sheet push:", e));
                    }

                    notify({
                        type: 'info',
                        title: 'Berhasil Disimpan',
                        message: `Jurnal karakter tanggal ${date} berhasil disimpan. Pencapaian: ${percentage}%!`,
                        icon: '🎉'
                    });
                } catch (e) {
                    notify({
                        type: 'error',
                        title: 'Gagal Menyimpan',
                        message: e.message || 'Terjadi kesalahan sistem.'
                    });
                } finally {
                    setIsSaving(false);
                }
            };

            return (
                <div className="space-y-4">
                    <div className="bg-gradient-to-r from-blue-600 to-indigo-600 rounded-2xl p-5 text-white shadow-md">
                        <div className="text-xs uppercase font-bold tracking-wider opacity-80">{user.schoolName}</div>
                        <h2 className="text-lg font-extrabold mt-0.5">{user.name}</h2>
                        <p className="text-xs text-blue-100">Kelas {user.classId}</p>
                    </div>

                    <div className="flex items-center justify-between bg-white p-3 rounded-2xl shadow-xs border border-slate-100 text-xs">
                        <span className="font-bold text-slate-600">Pilih Tanggal:</span>
                        <input
                            type="date"
                            value={date}
                            onChange={(e) => setDate(e.target.value)}
                            className="bg-slate-50 border border-slate-200 font-semibold text-slate-700 px-3 py-1.5 rounded-xl outline-none"
                        />
                    </div>

                    {isMonthLocked && (
                        <div className="bg-amber-50 border border-amber-200 text-amber-800 p-3.5 rounded-2xl text-xs flex items-center justify-between">
                            <div>
                                <p className="font-bold">🔒 Laporan Terkunci</p>
                                <p className="text-[11px] text-amber-600">Laporan bulan ini telah dikirim oleh Kepala Sekolah ke Pengawas.</p>
                            </div>
                        </div>
                    )}

                    {isFilled && !isMonthLocked && (
                        <div className="bg-emerald-50 border border-emerald-200 text-emerald-800 p-3.5 rounded-2xl text-xs flex items-center justify-between">
                            <div>
                                <p className="font-bold">✓ Jurnal hari ini sudah terisi</p>
                                <p className="text-[11px] text-emerald-600">Data telah dikunci dan tidak dapat diubah kembali.</p>
                            </div>
                            <span className="font-extrabold text-base text-emerald-700">
                                {todayLog.completionPercentage}%
                            </span>
                        </div>
                    )}

                    <HabitList
                        initialData={todayLog || {}}
                        onSave={handleSave}
                        isReadOnly={isFilled || isMonthLocked}
                        notify={notify}
                    />

                    {isSaving && (
                        <p className="text-center text-xs text-blue-600 animate-pulse font-semibold">
                            Sedang menyimpan data jurnal...
                        </p>
                    )}
                </div>
            );
        }

        function ParentDashboard({ user, notify }) {
            const [date, setDate] = React.useState(new Date().toISOString().split('T')[0]);
            const [childLog, setChildLog] = React.useState(null);
            const [isMonthLocked, setIsMonthLocked] = React.useState(false);

            const docPath = `logs_${user.schoolId}_${user.childId}`;

            React.useEffect(() => {
                if (!db) return;
                const unsub = db.collection('artifacts').doc(APP_ID)
                    .collection('public').doc('data')
                    .collection(docPath).doc(date)
                    .onSnapshot(doc => {
                        if (doc.exists) {
                            setChildLog(doc.data());
                        } else {
                            setChildLog(null);
                        }
                    }, err => console.error(err));

                const currentMonth = date.substring(0, 7);
                const unsubLock = db.collection('artifacts').doc(APP_ID)
                    .collection('public').doc('data')
                    .collection(`ks_reports_${user.schoolId}`).doc(currentMonth)
                    .onSnapshot(doc => {
                        if (doc.exists && doc.data().isSubmitted) setIsMonthLocked(true);
                        else setIsMonthLocked(false);
                    }, err => console.error("Lock listener error:", err));

                return () => {
                    unsub && unsub();
                    unsubLock && unsubLock();
                };
            }, [user.schoolId, user.childId, date]);

            const handleSaveValidation = async (rating) => {
                if (childLog && childLog.parentValidation) {
                    notify({
                        type: 'info',
                        title: 'Sudah Divalidasi',
                        message: 'Validasi orang tua hanya dapat diberikan 1 kali per hari untuk tanggal ini.'
                    });
                    return;
                }

                const sel = VALIDATION_OPTIONS.find(v => v.value === rating);
                const updateData = {
                    parentValidation: {
                        rating,
                        sticker: sel.icon,
                        label: sel.label,
                        timestamp: new Date().toISOString(),
                        parentName: user.name
                    }
                };

                try {
                    if (db) {
                        await db.collection('artifacts').doc(APP_ID)
                            .collection('public').doc('data')
                            .collection(docPath).doc(date)
                            .set(updateData, { merge: true });

        function PrincipalDashboard({ user, notify }) {
            const [selectedMonth, setSelectedMonth] = React.useState(new Date().toISOString().substring(0, 7));
            const [classStats, setClassStats] = React.useState([]);
            const [habitStats, setHabitStats] = React.useState({});
            const [isScanning, setIsScanning] = React.useState(false);
            const [reportDoc, setReportDoc] = React.useState({ classes: {}, analysis: {}, actionPlan: '', isSubmitted: false });
            
            const [formState, setFormState] = React.useState({ strongest: '', weakest: '', cause: '', actionPlan: '' });
            const [returnModal, setReturnModal] = React.useState({ isOpen: false, classId: '', note: '' });
            const [ksReplyInput, setKsReplyInput] = React.useState('');
            
            const schoolStudents = React.useMemo(() => {
                return ALL_STUDENTS.filter(s => s.schoolId === user.schoolId);
            }, [user.schoolId]);

            const schoolClasses = React.useMemo(() => {
                const s = new Set();
                schoolStudents.forEach(st => s.add(st.classId));
                return Array.from(s).sort((a, b) => a.localeCompare(b, undefined, { numeric: true }));
            }, [schoolStudents]);

            React.useEffect(() => {
                if (!db) return;
                const unsub = db.collection('artifacts').doc(APP_ID)
                    .collection('public').doc('data')
                    .collection(`ks_reports_${user.schoolId}`).doc(selectedMonth)
                    .onSnapshot(doc => {
                        if (doc.exists) {
                            const data = doc.data();
                            setReportDoc(data);
                            setHabitStats(data.habitStats || {});
                            setFormState({
                                strongest: data.analysis?.strongest || '',
                                weakest: data.analysis?.weakest || '',
                                cause: data.analysis?.cause || '',
                                actionPlan: data.actionPlan || ''
                            });
                            setKsReplyInput(data.ksReply || '');
                        } else {
                            setReportDoc({ classes: {}, analysis: {}, actionPlan: '', isSubmitted: false });
                            setHabitStats({});
                            setFormState({ strongest: '', weakest: '', cause: '', actionPlan: '' });
                        }
                    });
                return () => unsub && unsub();
            }, [selectedMonth, user.schoolId]);

            const handleFetchRekap = async () => {
                if (!db) {
                    notify({ type: 'error', title: 'Database Kosong', message: 'Firebase belum terhubung.' });
                    return;
                }
                setIsScanning(true);
                
                const stats = {};
                const hCounts = { h1: 0, h2: 0, h3: 0, h4: 0, h5: 0, h6: 0, h7: 0 };
                let totalSchoolLogsForHabits = 0;

                schoolClasses.forEach(c => {
                    stats[c] = { classId: c, totalStudents: 0, totalLogs: 0, sumScore: 0 };
                });

                for (const std of schoolStudents) {
                    if (stats[std.classId]) {
                        stats[std.classId].totalStudents += 1;
                    }
                    try {
                        const snap = await db.collection('artifacts').doc(APP_ID)
                            .collection('public').doc('data')
                            .collection(`logs_${user.schoolId}_${std.id}`)
                            .get();
                        
                        snap.forEach(d => {
                            if (d.id.startsWith(selectedMonth)) {
                                const data = d.data();
                                stats[std.classId].totalLogs += 1;
                                stats[std.classId].sumScore += (data.completionPercentage || 0);

                                totalSchoolLogsForHabits++;
                                HABITS.forEach(h => {
                                    if (data[h.id] && data[h.id].status) {
                                        hCounts[h.id]++;
                                    }
                                });
                            }
                        });
                    } catch (e) {
                        console.error("Recap scan error:", e);
                    }
                }

                const result = Object.values(stats).map(c => ({
                    ...c,
                    avgScore: c.totalLogs > 0 ? Math.round(c.sumScore / c.totalLogs) : 0
                }));
                
                const newHabitStats = {};
                if (totalSchoolLogsForHabits > 0) {
                    HABITS.forEach(h => {
                        newHabitStats[h.id] = Math.round((hCounts[h.id] / totalSchoolLogsForHabits) * 100);
                    });
                }

                setClassStats(result);
                setHabitStats(newHabitStats);
                
                // Save updated habits to report document immediately
                updateReportInDB({ habitStats: newHabitStats });

                setIsScanning(false);
                notify({ type: 'info', title: 'Selesai', message: 'Rekap kelas dan capaian kebiasaan bulan ini berhasil dimuat.', icon: '📊' });

                try {
                    await db.collection('artifacts').doc(APP_ID)
                        .collection('public').doc('data')
                        .collection(`ks_reports_${user.schoolId}`).doc(selectedMonth)
                        .set(updateData, { merge: true });

                    return;

                updateReportInDB({ classes: newClasses });
                setReturnModal({ isOpen: false, classId: '', note: '' });

                    },
                    actionPlan: formState.actionPlan
                });

            };

            const handleSubmitReport = () => {

                    type: 'confirm',

                    message: 'Pastikan seluruh kelas sudah tervalidasi dan analisis lengkap.\n\nSetelah dikirim, data bulan ini akan DIKUNCI PERMANEN dan tidak bisa diubah lagi oleh Siswa, Orang Tua, Guru, maupun Kepala Sekolah.',
                    confirmText: 'Ya, Kirim & Kunci',
                    cancelText: 'Periksa Lagi',
                    onConfirm: async () => {
                        await updateReportInDB({
                            analysis: {
                                strongest: formState.strongest,
                                weakest: formState.weakest,
                                cause: formState.cause
                            },
                            actionPlan: formState.actionPlan,
                            isSubmitted: true,
                            status: 'submitted',
                            submittedAt: new Date().toISOString()
                        });
                        notify({ type: 'info', title: 'Laporan Terkirim', message: 'Laporan berhasil dikunci dan dikirim ke pengawas.', icon: '🚀' });
                    }
                });
            };

            return (
                <div className="space-y-4">
                    <div className="bg-gradient-to-r from-amber-600 to-orange-600 rounded-2xl p-5 text-white shadow-md">
                        <div className="text-xs uppercase font-bold tracking-wider opacity-80">Dashboard Kepala Sekolah</div>
                        <h2 className="text-lg font-extrabold mt-0.5">{user.schoolName}</h2>
                        <p className="text-[11px] text-amber-100 mt-1">Alur Pelaporan: Guru → Kepala Sekolah → Pengawas</p>
                    </div>

                    <Card className="p-4">

                                <label className="block text-xs font-bold text-slate-500 mb-1">Pilih Bulan Laporan</label>

                                    type="month"
                                    value={selectedMonth}

                                        setSelectedMonth(e.target.value);
                                        setClassStats([]); 
                                        setHabitStats({});
                                    }}
                                    className="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 font-semibold text-slate-700 outline-none"
                                />
                            </div>
                            <button
                                onClick={handleFetchRekap}
                                disabled={isScanning}
                                className="w-full bg-slate-800 hover:bg-slate-900 active:scale-98 text-white font-bold py-3 rounded-xl text-xs transition-all shadow-sm"
                            >
                                {isScanning ? 'Memproses Data...' : '1. Muat Ulang Rekap Kelas'}
                            </button>
                        </div>
                    </Card>

                    {reportDoc.isSubmitted && (
                        <div className="bg-emerald-50 border-2 border-emerald-500 rounded-2xl p-4 text-center">
                            <span className="text-3xl block mb-2">✅</span>
                            <h3 className="font-extrabold text-emerald-800">Laporan Terkirim & Terkunci</h3>
                            <p className="text-xs text-emerald-600 mt-1">Laporan bulan {selectedMonth} telah dilaporkan ke Pengawas pada {new Date(reportDoc.submittedAt).toLocaleDateString('id-ID')}.</p>
                        </div>
                    )}

                    {reportDoc.isSubmitted && reportDoc.supervisorNote && (
                        <Card className="p-4 border-l-4 border-indigo-500 bg-indigo-50/30">
                            <h3 className="font-bold text-sm text-indigo-800 mb-2 flex items-center gap-1"><span>💬</span> Catatan Pengawas</h3>
                            <p className="text-xs text-slate-700 bg-white p-3 rounded-xl border border-indigo-100 mb-4 shadow-sm">{reportDoc.supervisorNote}</p>

                            <label className="block text-[11px] font-bold text-slate-500 uppercase tracking-wider mb-2">Balas Catatan Pengawas</label>
                            <textarea
                                value={ksReplyInput}
                                onChange={e => setKsReplyInput(e.target.value)}
                                placeholder="Tuliskan balasan Anda di sini..."
                                className="w-full bg-white border border-slate-200 rounded-xl p-3 text-xs outline-none focus:border-blue-500 min-h-[60px] mb-3"
                            />
                            <button
                                onClick={() => {
                                    updateReportInDB({ ksReply: ksReplyInput, status: 'replied' });
                                    notify({ type: 'info', title: 'Terkirim', message: 'Balasan ke pengawas berhasil dikirim.' });
                                }}
                                className="w-full bg-blue-600 hover:bg-blue-700 active:scale-98 text-white font-bold py-2.5 rounded-xl text-xs transition-all shadow-sm"
                            >
                                Kirim Balasan
                            </button>
                        </Card>
                    )}

                    {Object.keys(habitStats).length > 0 && (
                        <Card className="overflow-hidden animate-fade-in-up">
                            <div className="bg-slate-50 px-4 py-3 border-b border-slate-100 text-xs font-bold text-slate-700 flex items-center justify-between">
                                Rekapitulasi Capaian Tiap Kebiasaan
                            </div>
                            <div className="divide-y divide-slate-100">
                                {HABITS.map((h, idx) => {
                                    const pct = habitStats[h.id] || 0;
                                    const style = getHabitStyle(pct);
                                    return (
                                        <div key={h.id} className={`p-3 flex items-center justify-between text-xs border-l-4 ${style.border} bg-white`}>
                                            <div className="flex items-center gap-3">
                                                <span className="text-2xl">{style.icon}</span>
                                                <div>
                                                    <p className="font-bold text-slate-800">{idx + 1}. {h.title}</p>
                                                    <p className="text-[10px] text-slate-500">{h.desc}</p>
                                                </div>
                                            </div>
                                            <div className="text-right">
                                                <div className={`font-extrabold text-sm ${style.text}`}>{pct}%</div>
                                                <div className={`text-[10px] font-bold ${style.text}`}>{style.label}</div>
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>
                        </Card>
                    )}

                    {classStats.length > 0 && (
                        <div className="space-y-4">
                            <Card className="overflow-hidden">
                                <div className="bg-slate-50 px-4 py-3 border-b border-slate-100 text-xs font-bold text-slate-700">
                                    2. Validasi Rekap Kelas
                                </div>
                                <div className="divide-y divide-slate-100">
                                    {classStats.map(stat => {
                                        // FIXED: Optional chaining used here
                                        const status = reportDoc?.classes?.[stat.classId]?.status || 'pending';
                                        return (
                                            <div key={stat.classId} className="p-3 flex flex-col gap-2 text-xs">
                                                <div className="flex items-center justify-between">
                                                    <div>
                                                        <span className="font-bold text-sm">Kelas {stat.classId}</span>
                                                        <p className="text-[11px] text-slate-500">{stat.totalStudents} Siswa • {stat.totalLogs} Log • Rata-rata Skor: <span className="font-bold text-blue-600">{stat.avgScore}%</span></p>
                                                    </div>
                                                    <div>
                                                        {status === 'validated' && <span className="text-[10px] font-bold text-emerald-600 bg-emerald-50 px-2 py-1 rounded-md">✓ Valid</span>}
                                                        {status === 'returned' && <span className="text-[10px] font-bold text-red-600 bg-red-50 px-2 py-1 rounded-md">⚠ Dikembalikan</span>}
                                                    </div>
                                                </div>
                                                {!reportDoc.isSubmitted && status !== 'validated' && (
                                                    <div className="flex gap-2 justify-end mt-1">
                                                        <button onClick={() => setReturnModal({ isOpen: true, classId: stat.classId, note: '' })} className="px-3 py-1.5 bg-red-50 hover:bg-red-100 text-red-600 font-bold rounded-lg transition-colors">Kembalikan</button>
                                                        <button onClick={() => handleValidateClass(stat.classId)} className="px-3 py-1.5 bg-emerald-50 hover:bg-emerald-100 text-emerald-600 font-bold rounded-lg transition-colors">Validasi ✓</button>
                                                    </div>
                                                )}
                                            </div>
                                        );
                                    })}
                                </div>
                            </Card>

                            {!reportDoc.isSubmitted && (
                                <Card className="p-4 space-y-4">
                                    <h3 className="font-bold text-sm text-slate-800 border-b pb-2">3 & 4. Analisis & Rencana Tindak Lanjut</h3>
                                    <div>
                                        <label className="block text-[11px] font-bold text-slate-500 uppercase mb-1">Kebiasaan Paling Kuat</label>
                                        <textarea value={formState.strongest} onChange={e => setFormState({...formState, strongest: e.target.value})} className="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-xs outline-none focus:border-blue-500" placeholder="Contoh: Mayoritas siswa tertib beribadah..."></textarea>
                                    </div>
                                    <div>
                                        <label className="block text-[11px] font-bold text-slate-500 uppercase mb-1">Kebiasaan Paling Lemah</label>
                                        <textarea value={formState.weakest} onChange={e => setFormState({...formState, weakest: e.target.value})} className="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-xs outline-none focus:border-blue-500" placeholder="Contoh: Kesulitan bangun pagi dan tidur tepat waktu..."></textarea>
                                    </div>
                                    <div>
                                        <label className="block text-[11px] font-bold text-slate-500 uppercase mb-1">Penyebab (Dugaan)</label>
                                        <textarea value={formState.cause} onChange={e => setFormState({...formState, cause: e.target.value})} className="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-xs outline-none focus:border-blue-500" placeholder="Contoh: Terlalu banyak bermain HP sebelum tidur..."></textarea>
                                    </div>
                                    <div>
                                        <label className="block text-[11px] font-bold text-slate-500 uppercase mb-1">Rencana Tindak Lanjut</label>
                                        <textarea value={formState.actionPlan} onChange={e => setFormState({...formState, actionPlan: e.target.value})} className="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-xs outline-none focus:border-blue-500" placeholder="Contoh: Mengadakan sosialisasi ke orang tua terkait screen time..."></textarea>
                                    </div>

                                    <div className="flex gap-2 pt-3 border-t border-slate-100">
                                        <button onClick={handleSaveDraft} className="flex-1 bg-slate-100 hover:bg-slate-200 active:scale-98 text-slate-700 font-bold py-3 rounded-xl text-xs transition-all">Simpan Draf</button>
                                        <button onClick={handleSubmitReport} className="flex-1 bg-blue-600 hover:bg-blue-700 active:scale-98 text-white font-bold py-3 rounded-xl text-xs transition-all shadow-md shadow-blue-200">5. Kirim Laporan ✓</button>
                                    </div>
                                </Card>
                            )}
                        </div>
                    )}

                    {returnModal.isOpen && (
                        <div className="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
                            <div className="bg-white rounded-2xl w-full max-w-sm p-5">
                                <h3 className="font-bold text-slate-800 mb-2">Kembalikan Laporan Kelas {returnModal.classId}</h3>
                                <p className="text-[11px] text-slate-500 mb-3">Berikan catatan perbaikan untuk wali kelas.</p>
                                <textarea
                                    value={returnModal.note}
                                    onChange={e => setReturnModal({ ...returnModal, note: e.target.value })}
                                    placeholder="Contoh: Mohon lengkapi validasi siswa yang belum mengisi..."
                                    className="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-xs outline-none focus:border-red-500 min-h-[80px] mb-4"
                                />
                                <div className="flex gap-2">
                                    <button onClick={() => setReturnModal({ isOpen: false, classId: '', note: '' })} className="flex-1 bg-slate-100 text-slate-600 font-bold py-2.5 rounded-xl text-xs">Batal</button>
                                    <button onClick={handleReturnClass} className="flex-1 bg-red-600 text-white font-bold py-2.5 rounded-xl text-xs">Kirim Catatan</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        function SupervisorDashboard({ user, notify }) {
            const [selectedMonth, setSelectedMonth] = React.useState(new Date().toISOString().substring(0, 7));
            const [schoolsData, setSchoolsData] = React.useState([]);
            const [selectedSchool, setSelectedSchool] = React.useState(null);
            const [supervisorNote, setSupervisorNote] = React.useState('');

            React.useEffect(() => {
                if (!db) return;
                const unsubscribes = [];
                const dataMap = new Map();

                SCHOOLS.forEach(school => {
                    const unsub = db.collection('artifacts').doc(APP_ID)
                        .collection('public').doc('data')
                        .collection(`ks_reports_${school.id}`).doc(selectedMonth)
                        .onSnapshot(doc => {
                            if (doc.exists) {
                                dataMap.set(school.id, { school, report: doc.data() });
                            } else {
                                dataMap.set(school.id, { school, report: null });
                            }
                            // Ensuring consistent order
                            const sortedData = SCHOOLS.map(s => dataMap.get(s.id) || { school: s, report: null });
                            setSchoolsData(sortedData);
                        });
                    unsubscribes.push(unsub);
                });

                return () => unsubscribes.forEach(fn => fn());
            }, [selectedMonth]);

            const handleSendNote = async () => {
                if (!selectedSchool) return;
                try {
                    await db.collection('artifacts').doc(APP_ID)
                        .collection('public').doc('data')
                        .collection(`ks_reports_${selectedSchool.school.id}`).doc(selectedMonth)
                        .set({
                            supervisorNote: supervisorNote,
                            status: 'reviewed',
                            reviewedAt: new Date().toISOString()
                        }, { merge: true });
                    
                    notify({ type: 'info', title: 'Terkirim', message: 'Catatan balasan ke Kepala Sekolah berhasil dikirim.', icon: '✅' });
                    setSelectedSchool(null);
                    setSupervisorNote('');
                } catch (e) {
                    notify({ type: 'error', title: 'Gagal', message: e.message });
                }
            };

            return (
                <div className="space-y-4">
                    <div className="bg-gradient-to-r from-indigo-600 to-blue-600 rounded-2xl p-5 text-white shadow-md">
                        <div className="text-xs uppercase font-bold tracking-wider opacity-80">Dashboard Pengawas</div>
                        <h2 className="text-lg font-extrabold mt-0.5">Pemantauan Laporan Bulanan</h2>
                        <p className="text-[11px] text-indigo-100 mt-1">Status Laporan: Belum Melapor → Terkirim → Sudah Ditanggapi</p>
                    </div>

                    <Card className="p-4">
                        <label className="block text-xs font-bold text-slate-500 mb-1">Pilih Bulan Laporan</label>
                        <input
                            type="month"
                            value={selectedMonth}
                            onChange={(e) => setSelectedMonth(e.target.value)}
                            className="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 font-semibold text-slate-700 outline-none"
                        />
                    </Card>

                    <Card className="overflow-hidden">
                        <div className="bg-slate-50 px-4 py-3 border-b border-slate-100 text-xs font-bold text-slate-700">
                            Status Pelaporan Sekolah
                        </div>
                        <div className="divide-y divide-slate-100 student-list max-h-96 overflow-y-auto">
                            {schoolsData.map(data => {
                                const school = data.school;
                                const report = data.report;
                                const isSubmitted = report?.isSubmitted;
                                const status = report?.status || (isSubmitted ? 'submitted' : 'draft');
                                
                                return (
                                    <div key={school.id} className="p-4 flex items-center justify-between">
                                        <div>
                                            <p className="font-bold text-sm text-slate-800">{school.name}</p>
                                            <div className="mt-1 flex items-center gap-2">
                                                {!isSubmitted && <span className="text-[10px] font-bold text-red-600 bg-red-50 px-2 py-1 rounded-md">Belum Melapor</span>}
                                                {isSubmitted && status === 'submitted' && <span className="text-[10px] font-bold text-amber-600 bg-amber-50 px-2 py-1 rounded-md">Menunggu Tanggapan</span>}
                                                {isSubmitted && status === 'reviewed' && <span className="text-[10px] font-bold text-emerald-600 bg-emerald-50 px-2 py-1 rounded-md">Sudah Ditanggapi</span>}
                                                {isSubmitted && status === 'replied' && <span className="text-[10px] font-bold text-blue-600 bg-blue-50 px-2 py-1 rounded-md">Dibalas KS</span>}
                                                
                                                {/* Mini indicators if habits exist */}
                                                {isSubmitted && report?.habitStats && (
                                                    <span className="text-[10px] text-slate-400">| Data Kebiasaan Tersedia</span>
                                                )}
                                            </div>
                                        </div>
                                        
                                        {isSubmitted && (
                                            <button 
                                                onClick={() => {
                                                    setSelectedSchool(data);
                                                    setSupervisorNote(report.supervisorNote || '');
                                                }}
                                                className="px-3 py-1.5 bg-indigo-50 hover:bg-indigo-100 active:scale-98 text-indigo-700 rounded-lg text-xs font-bold transition-all"
                                            >
                                                Buka Laporan
                                            </button>
                                        )}
                                    </div>
                                );
                            })}
                        </div>
                    </Card>

                    {selectedSchool && (
                        <div className="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4 animate-fade-in">
                            <div className="bg-white rounded-3xl w-full max-w-lg max-h-[90vh] flex flex-col shadow-2xl animate-fade-in-up">
                                <div className="p-4 border-b border-slate-100 flex justify-between items-center bg-slate-50 rounded-t-3xl">
                                    <div>
                                        <h3 className="font-bold text-slate-800">Laporan {selectedSchool.school.name}</h3>
                                        <p className="text-[11px] text-slate-500">Bulan: {selectedMonth}</p>
                                    </div>
                                    <button onClick={() => setSelectedSchool(null)} className="w-8 h-8 rounded-full bg-slate-200 hover:bg-slate-300 text-slate-600 font-bold flex items-center justify-center transition-colors">✕</button>
                                </div>
                                
                                <div className="p-4 overflow-y-auto space-y-4 flex-1 student-list">
                                    
                                    {/* Capaian Tiap Kebiasaan (New Feature) */}
                                    {selectedSchool.report?.habitStats && Object.keys(selectedSchool.report.habitStats).length > 0 && (
                                        <div className="mb-5">
                                            <h4 className="text-[11px] font-bold text-slate-500 mb-2 uppercase tracking-wider">Capaian Tiap Kebiasaan:</h4>
                                            <div className="border border-slate-100 rounded-xl overflow-hidden divide-y divide-slate-100 shadow-sm">
                                                {HABITS.map((h, idx) => {
                                                    const pct = selectedSchool.report.habitStats[h.id] || 0;
                                                    const style = getHabitStyle(pct);
                                                    return (
                                                        <div key={h.id} className={`p-2.5 flex items-center justify-between text-xs border-l-4 ${style.border} bg-white`}>
                                                            <div className="flex items-center gap-2">
                                                                <span className="text-lg">{style.icon}</span>
                                                                <div>
                                                                    <p className="font-bold text-slate-800 leading-tight">{idx + 1}. {h.title}</p>
                                                                    <p className="text-[9px] text-slate-500">{h.desc}</p>
                                                                </div>
                                                            </div>
                                                            <div className="text-right">
                                                                <div className={`font-extrabold text-sm ${style.text}`}>{pct}%</div>
                                                                <div className={`text-[9px] font-bold ${style.text}`}>{style.label}</div>
                                                            </div>
                                                        </div>
                                                    );
                                                })}
                                            </div>
                                        </div>
                                    )}

                                    <div>
                                        <h4 className="text-[11px] font-bold text-slate-500 mb-1 uppercase tracking-wider">Kebiasaan Terkuat:</h4>
                                        <p className="text-xs text-slate-700 bg-slate-50 p-3 rounded-xl border border-slate-100">{selectedSchool.report?.analysis?.strongest || '-'}</p>
                                    </div>
                                    <div>
                                        <h4 className="text-[11px] font-bold text-slate-500 mb-1 uppercase tracking-wider">Kebiasaan Terlemah:</h4>
                                        <p className="text-xs text-slate-700 bg-slate-50 p-3 rounded-xl border border-slate-100">{selectedSchool.report?.analysis?.weakest || '-'}</p>
                                    </div>
                                    <div>
                                        <h4 className="text-[11px] font-bold text-slate-500 mb-1 uppercase tracking-wider">Dugaan Penyebab:</h4>
                                        <p className="text-xs text-slate-700 bg-slate-50 p-3 rounded-xl border border-slate-100">{selectedSchool.report?.analysis?.cause || '-'}</p>
                                    </div>
                                    <div>
                                        <h4 className="text-[11px] font-bold text-slate-500 mb-1 uppercase tracking-wider">Rencana Tindak Lanjut:</h4>
                                        <p className="text-xs text-slate-800 font-medium bg-blue-50/50 p-3 rounded-xl border border-blue-100">{selectedSchool.report?.actionPlan || '-'}</p>
                                    </div>

                                    {selectedSchool.report?.ksReply && (
                                        <div className="border-l-4 border-l-blue-500 pl-3 py-1 mt-2">
                                            <h4 className="text-[11px] font-bold text-blue-600 mb-1 uppercase tracking-wider">Balasan Kepala Sekolah:</h4>
                                            <p className="text-xs text-slate-700">{selectedSchool.report.ksReply}</p>
                                        </div>
                                    )}

                                    <div className="pt-3 mt-3 border-t border-slate-100">
                                        <label className="block text-[11px] font-bold text-indigo-600 mb-2 uppercase tracking-wider">Beri Catatan / Tanggapan Pengawas:</label>
                                        <textarea
                                            value={supervisorNote}
                                            onChange={e => setSupervisorNote(e.target.value)}
                                            placeholder="Tuliskan apresiasi atau arahan perbaikan untuk sekolah ini..."
                                            className="w-full bg-indigo-50/30 border border-indigo-200 rounded-xl p-3 text-xs outline-none focus:border-indigo-500 min-h-[80px]"
                                        />
                                    </div>
                                </div>

                                <div className="p-4 border-t border-slate-100 bg-slate-50 rounded-b-3xl">
                                    <button 
                                        onClick={handleSendNote}
                                        className="w-full py-3.5 bg-indigo-600 hover:bg-indigo-700 active:scale-98 text-white rounded-xl text-xs font-bold shadow-md shadow-indigo-200 transition-all"
                                    >
                                        Kirim Tanggapan ke Sekolah
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        function App() {
            const [currentUser, setCurrentUser] = React.useState(null);
            const [authLoading, setAuthLoading] = React.useState(true);
            const [notificationConfig, setNotificationConfig] = React.useState(null);

            const triggerNotification = (config) => {
                setNotificationConfig(config);
            };

            React.useEffect(() => {
                const init = async () => {
                    try {
                        if (auth) {
                            if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                                await auth.signInWithCustomToken(__initial_auth_token);
                            } else {
                                await auth.signInAnonymously();
                            }
                        }
                    } catch (e) {
                        console.warn("Auth initialization fallback:", e);
                    } finally {
                        setAuthLoading(false);
                    }
                };

                init();
            }, []);

            if (authLoading) {
                return (
                    <div className="flex-1 flex items-center justify-center text-xs text-slate-400 font-semibold">
                        Menyiapkan Sistem SI-PENDAR...
                    </div>
                );
            }

            return (
                <div className="flex-1 flex flex-col">
                    <header className="bg-white/95 backdrop-blur-md border-b border-slate-200 sticky top-0 z-30 px-4 h-14 flex items-center justify-between">
                        <div className="flex items-center gap-2.5">
                            <img src="https://lh3.googleusercontent.com/d/1c6uHZ_Ua16c52Oz0X-4dCG-nkFNcSsI6" onError={(e) => { e.target.onerror = null; e.target.src = "https://drive.google.com/thumbnail?id=1c6uHZ_Ua16c52Oz0X-4dCG-nkFNcSsI6&sz=w200"; }} alt="Logo" className="w-10 h-10 object-contain drop-shadow-sm" />
                            <div>
                                <h1 className="font-extrabold text-xs text-slate-800 leading-tight">SI-PENDAR</h1>
                                <p className="text-[10px] text-slate-500">
                                    {currentUser ? currentUser.schoolName : 'Tujuh Kebiasaan Kecil, Anak Hebat'}
                                </p>
                            </div>
                        </div>

                        {currentUser && (
                            <button
                                onClick={() => {
                                    triggerNotification({
                                        type: 'confirm',
                                        title: 'Keluar Akun',
                                        message: 'Apakah Anda yakin ingin keluar dari sesi ini?',
                                        confirmText: 'Ya, Keluar',
                                        cancelText: 'Tetap di Sini',
                                        onConfirm: () => setCurrentUser(null)
                                    });
                                }}
                                className="px-3 py-1.5 rounded-xl text-xs font-bold text-slate-600 bg-slate-100 hover:bg-slate-200 transition-colors"
                            >
                                Keluar
                            </button>
                        )}
                    </header>

                    <main className="flex-1 p-4 pb-12">
                        {!currentUser ? (
                            <LoginScreen onLogin={setCurrentUser} notify={triggerNotification} />
                        ) : (
                            <>
                                {currentUser.role === 'student' && (
                                    <StudentDashboard user={currentUser} notify={triggerNotification} />
                                )}
                                {currentUser.role === 'parent' && (
                                    <ParentDashboard user={currentUser} notify={triggerNotification} />
                                )}
                                {currentUser.role === 'teacher' && (
                                    <TeacherDashboard user={currentUser} notify={triggerNotification} />
                                )}
                                {currentUser.role === 'principal' && (
                                    <PrincipalDashboard user={currentUser} notify={triggerNotification} />
                                )}
                                {currentUser.role === 'supervisor' && (
                                    <SupervisorDashboard user={currentUser} notify={triggerNotification} />
                                )}
                            </>
                        )}
                    </main>

                    <NotificationModal
                        config={notificationConfig}
                        onClose={() => setNotificationConfig(null)}
                    />
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
